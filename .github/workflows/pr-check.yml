name: PR Check

# Build-and-validate gate for pull requests into main. This does NOT deploy —
# deploy.yml owns deployment and runs only on push to main (i.e. a PR merge).
# This workflow exists so branch protection has a required status check ("build")
# to enforce on every PR before merge.

# No paths filter on purpose. "build" is a REQUIRED status check (branch
# protection), and a required check that is skipped by a paths filter sits
# pending forever — blocking any PR that doesn't touch a filtered path (config-
# or docs-only PRs included). Running a full build on every PR into main is cheap
# and always-correct, and guarantees the required check is always present.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # Regression tests for the branch resolver in scripts/check_staleness.py.
      # They read committed drupal.org XML fixtures, touch no network, and
      # finish in well under a second, so they run first and fail fast. They
      # belong in this required check rather than in staleness-check.yml:
      # that workflow is a weekly report that never gates, so a resolver
      # regression landing there would surface only after it had already
      # published a wrong version number — which has happened twice.
      - run: python -m pytest tests/
      - run: python scripts/validate_recipes.py
      # Three publishing defects that `mkdocs build --strict` structurally
      # cannot catch, each of which shipped before this check existed: an
      # absolute /home/<user> path (mkdocs logs an absolute link as INFO, never
      # a warning), a renamed slug (a slug IS a published URL, and llms.txt
      # links only topic indexes so nothing notices the 404), and a guide whose
      # When to Use section no longer carries the source's own text. Ratcheted
      # against publish-invariants-baseline.json: pre-existing entries pass, a
      # new one fails. The source guides live outside this repo, so CI enforces
      # the local-path check and reports the other two as skipped — run the
      # script locally, where the sources are, before a partition PR.
      - run: python scripts/check_publish_invariants.py
      # --strict catches broken nav/links and unresolved anchors as build
      # failures. The legacy cross-partition anchor links and broken relative
      # links that previously blocked --strict were cleaned up; keep this strict
      # so regressions fail the PR rather than ship.
      - run: mkdocs build --strict
