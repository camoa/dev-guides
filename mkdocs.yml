site_name: Dev Guides
site_url: https://camoa.github.io/dev-guides/
site_description: AI-friendly decision guides for web development

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes

plugins:
  - search
  - awesome-nav
  # Published guide URLs are a contract: llms.txt links only topic indexes, but
  # readers, bookmarks and any navigator cache hold direct guide URLs. When a
  # partition slug changes, map the old path here rather than letting it 404.
  - redirects:
      redirect_maps:
        drupal/custom-field/column-types.md: drupal/custom-field/column-types-text.md
        drupal/custom-field/best-practices.md: drupal/custom-field/best-practices-performance.md
        drupal/custom-field/widget-plugins.md: drupal/custom-field/widget-plugins-overview.md
  - llmstxt-md:
      enable_copy_button: false
      enable_llms_txt: false
      enable_llms_full: false

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
